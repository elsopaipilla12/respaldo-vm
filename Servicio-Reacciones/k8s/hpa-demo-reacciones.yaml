# Prueba aislada de HPA con la misma imagen de Reacciones v1.0.2.
# NO sustituye al servicio integrado ni demuestra consistencia de datos entre replicas.
# No crea PVC, Service, Ingress, Secrets ni modifica el Deployment principal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reaction-service-autoscale-demo
  namespace: grupo-reacciones
  labels:
    app.kubernetes.io/name: reaction-service-autoscale-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reaction-service-autoscale-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reaction-service-autoscale-demo
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reaction-service
          image: ghcr.io/sebajusm/reaction-service:v1.0.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:////tmp/reactions-demo.db"
            - name: DATABASE_ECHO
              value: "false"
            - name: EVENTS_ENABLED
              value: "false"
            - name: EVENTS_REQUIRED
              value: "false"
            - name: EXTERNAL_VALIDATION_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 160Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reaction-service-autoscale-demo
  namespace: grupo-reacciones
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reaction-service-autoscale-demo
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
