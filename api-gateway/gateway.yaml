apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: grupo-reacciones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # 1. Le decimos al cluster que no correremos como root (usamos el usuario 'node' = 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/elsopaipilla12/api-gateway:latest
        ports:
        - containerPort: 3000
        # 2. Quitamos todos los permisos de escalamiento y capacidades del sistema
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: grupo-reacciones
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000